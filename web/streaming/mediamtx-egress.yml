# MediaMTX v1.20.1 egress. The host firewall exposes RTSP :554; publishing stays loopback-only.
logLevel: info
readTimeout: 20s
writeTimeout: 20s
api: true
apiAddress: 127.0.0.1:9998
rtsp: true
rtspAddress: :554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: false
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    ips: [127.0.0.1/32, ::1/128]
    permissions:
      - action: publish
        path: "~^live/[A-Za-z0-9]{12}$"
      - action: api
  - user: any
    pass: ""
    permissions:
      - action: read
        path: "~^live/[A-Za-z0-9]{12}$"
pathDefaults:
  overridePublisher: false
  # One 40-person world plus headroom caps a single live path at about 83 Mbps.
  maxReaders: 60
paths:
  "~^live/[A-Za-z0-9]{12}$": {}
