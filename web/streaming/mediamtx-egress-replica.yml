# MediaMTX v1.20.1 read-replica egress. The host firewall exposes RTSP :554 for readers; this node
# never accepts a publisher and has no relay hook.
# The pull uses MediaMTX's native `source` (gortsplib), not ffmpeg: ffmpeg's RTSP H.264 parser holds
# each frame until the next access unit, adding one source frame interval per hop (250 ms at 4 fps;
# 250 ms -> 0.3 ms measured, see docs/streaming/verification.md I27).
logLevel: info
readTimeout: 20s
writeTimeout: 20s
api: true
apiAddress: 127.0.0.1:9998
rtsp: true
rtspAddress: :554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: false
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    ips: [127.0.0.1/32, ::1/128]
    permissions:
      - action: api
  - user: any
    pass: ""
    permissions:
      - action: read
        path: "~^live/[A-Za-z0-9]{12}$"
pathDefaults:
  overridePublisher: false
  # One 40-person world plus headroom caps a single live path at about 83 Mbps.
  maxReaders: 60
paths:
  # The capture group is required: `source` expands `$G1` (first regexp group), not `$MTX_PATH`.
  # `stream.web-screen.net` resolves to the origin only; moving the origin is a DNS change here.
  "~^live/([A-Za-z0-9]{12})$":
    source: rtsp://stream.web-screen.net:554/live/$G1
    sourceOnDemand: true
    # The pull starts when the first reader arrives and stops 10s after the last one leaves.
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
    rtspTransport: tcp
