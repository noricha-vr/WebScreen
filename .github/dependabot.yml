# Dependabot: バージョン更新は止め、セキュリティ更新だけを受ける。例外は github-actions の月 1 回
# github-actions は SHA 固定で alert が出ないため。他は open-pull-requests-limit: 0（security updates は別枠）
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"
