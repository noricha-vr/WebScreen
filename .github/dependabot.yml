# Dependabot: バージョン更新は止め、セキュリティ更新だけを受ける（2026-11-06 CEO 決定）
# open-pull-requests-limit: 0 は version updates だけを止める（security updates は別枠の上限 10 で動き続ける）
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 0
    labels: ["dependencies"]
