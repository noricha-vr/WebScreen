# Dependabot の設定。週 1 回、patch と minor をまとめて 1 本の PR にする
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
