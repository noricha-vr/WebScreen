# ladder-stage: 1
#
# 検査対象は web/（Cloudflare β 版）のみ。既存の Python 実装（router/ movie_maker/ 等）は
# ゲート外にする。β の構造を先に固めるのが目的で、移行前のコードに後付けの契約を
# かぶせても違反リストが出るだけで設計は良くならないため。
#
# 記述規約の正本: ~/.claude/docs/architecture-contract.md
# 検査: python3 ~/.claude/scripts/check-architecture.py --root .

# .astro はチェッカーが解析しないため対象外（コンポーネント側の import 方向は
# レビューで見る）。.ts に閉じた層構造だけを機械検査する。
extensions = [".ts", ".tsx"]

[limits]
max_file_loc = 400
max_public_symbols = 40

[rules]
no_cycles = true

# 最内層。API 型・セッション形式・R2 キー導出の正本で、他のどこにも依存しない。
# Wave 2 以降の並列実装が全員ここを import するため、依存を足すと全体に波及する。
[modules.contracts]
paths = ["web/src/lib/contracts"]
may_depend_on = []
forbidden_imports = [
  # workerd と bun test の両方で同じコードを動かすため Web 標準 API のみ使う
  # （node:crypto / Buffer は workerd で挙動が変わる）。
  "^node:",
  # フレームワーク非依存を保つ（Astro の実行文脈なしでテストできること）。
  "^astro",
  "^@astrojs/",
  "^cloudflare:",
]

# 構造化ログ。外部依存を持たず（console へ 1 行 JSON を書くだけ）、失敗を記録する層から
# 直接呼べる横断的関心事なので infra から出してある。infra に置くと entrypoints から
# ログを出せず、かといって entrypoints → infra を開けると D1 / R2 の直叩きまで通るため。
# 現在の呼び出し元は services / entrypoints / tests。infra・cron・screen_share から
# 呼びたくなったら、その層の may_depend_on に足す（今は参照がないので開けていない）。
[modules.observability]
paths = ["web/src/lib/observability"]
may_depend_on = ["contracts"]
forbidden_imports = [
  # 外部依存を持たないことを機械で守る。ここに cloudflare:workers や外部 logger が
  # 入ると「どの層からでも呼べる」前提が崩れ、entrypoints から機密へ到達できてしまう。
  "^node:",
  "^astro",
  "^@astrojs/",
  "^cloudflare:",
]

# 外部依存の隔離層（D1 / R2 / Discord API / web-capture の呼び出し）。
[modules.infra]
paths = ["web/src/lib/infra"]
may_depend_on = ["contracts"]

# ドメインロジック。infra 越しにしか外部へ触らない。
[modules.services]
paths = ["web/src/lib/services"]
may_depend_on = ["infra", "contracts", "observability"]

# エントリポイント。HTTP と services の間の I/O 変換だけを担い、ロジックを持たない。
# infra を直接叩くのは禁止（services を経由させる）。observability だけは、
# entrypoints の catch-all でしか捕まえられない失敗を記録するために直接使ってよい。
[modules.entrypoints]
paths = ["web/src/pages", "web/src/middleware.ts"]
may_depend_on = ["services", "contracts", "observability"]
max_file_loc = 200

# cron トリガー専用の独立 Worker（web/cron/wrangler.jsonc で単体デプロイする）。
# entrypoints と同じく I/O 変換だけを担う層で、判定ロジックは services に置く。
# services 側の may_depend_on に cron は無いので、逆流（services → cron）は違反になる。
[modules.cron]
paths = ["web/cron/src"]
may_depend_on = ["services", "contracts"]
max_file_loc = 200

# 画面共有 feature。内部は index（composition root）から controller →
# view/capture/session/stream-api/video-profile へだけ配線する。
# audio-profile / stream-profile / request-json / whip-publisher 等の共有 UI utility は
# 現段階では未登録モジュールとして扱い、feature への逆 import をレビューで禁止する。
[modules.screen_share]
paths = ["web/src/lib/ui/screen-share"]
may_depend_on = ["contracts"]
max_file_loc = 400

# テストは検査対象を直接 import する層。cron を含めるのは、保持期間バッチの
# 構造化ログ（件数の出し方）を workerd 無しで検証するため。
[modules.tests]
paths = ["web/tests", "web/e2e"]
may_depend_on = ["contracts", "observability", "infra", "services", "entrypoints", "cron", "screen_share"]
max_file_loc = 500
max_public_symbols = 0
